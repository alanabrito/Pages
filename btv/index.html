<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>btv</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f5f1;
      --panel: #ffffff;
      --text: #171717;
      --muted: #5b5b57;
      --accent: #165dff;
      --border: #e6e3dc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f6f5f1 0%, #ecebe3 100%);
      color: var(--text);
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2.2rem;
    }

    p {
      margin: 0 0 16px;
      line-height: 1.6;
    }

    .muted {
      color: var(--muted);
    }

    .links {
      display: grid;
      gap: 14px;
      margin-top: 24px;
    }

    a.link {
      display: block;
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      background: #fafaf8;
    }

    a.link strong {
      display: block;
      margin-bottom: 4px;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <article class="card">
      <h1>btv</h1>
      <p class="muted">Official support and privacy pages for the btv iPhone app.</p>

      <div class="links">
        <a class="link" href="support.html">
          <strong>Support</strong>
          Help, contact information, and troubleshooting guidance.
        </a>
        <a class="link" href="privacy-policy.html">
          <strong>Privacy Policy</strong>
          How btv accesses and uses account, playback, and integration data.
        </a>
      </div>
    </article>
  </main>
</body>
</html>
